name: Publish Tolaria package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tolaria release tag; leave blank to use the latest alpha
        required: false
        type: string
  repository_dispatch:
    types: [tolaria-release]

permissions:
  contents: read

concurrency:
  group: pacman-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Tolaria alpha
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$REQUESTED_RELEASE_TAG
          if [[ -z "$release_tag" ]]; then
            release_tag=$(gh api 'repos/refactoringhq/tolaria/releases?per_page=100' \
              --jq '[.[] | select(.prerelease and (.draft | not))][0].tag_name')
          fi
          if [[ ! "$release_tag" =~ ^alpha-v[0-9]+\.[0-9]+\.[0-9]+-alpha\.0*[0-9]+$ ]]; then
            echo "Unexpected Tolaria release tag: $release_tag" >&2
            exit 1
          fi

          gh api "repos/refactoringhq/tolaria/releases/tags/$release_tag" \
            | jq --slurp '.' > release.json
          test "$(jq -r '.[0].tag_name' release.json)" = "$release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Install Arch build environment
        run: docker pull archlinux:latest

      - name: Build package and repository
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          mkdir -p site/x86_64 site/release-tags
          docker run --rm \
            -e RELEASE_TAG \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Sy --noconfirm archlinux-keyring || true
              for attempt in 1 2 3; do
                pacman -S --noconfirm --needed base-devel curl jq libarchive && break
                test "$attempt" -lt 3 && sleep 15
              done
              command -v makepkg jq bsdtar
              useradd -m builder
              chmod -R a+rwX /work
              test -s /work/release.json
              cd /work/packages/tolaria-alpha-bin
              tag=$(jq -r "[.[] | select(.prerelease and (.draft | not))][0].tag_name" /work/release.json)
              deb_asset=$(jq -r --arg tag "$tag" ".[] | select(.tag_name == \$tag) | .assets[].name" /work/release.json | grep "_amd64\\.deb$" | head -n1)
              version=$(sed -nE "s/^alpha-v([0-9]+\\.[0-9]+\\.[0-9]+)-alpha\\.0*([0-9]+)$/\\1.alpha.\\2/p" <<<"$tag")
              test -n "$version"
              sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
              chmod a+rw PKGBUILD .SRCINFO
              su builder -s /bin/bash -c "makepkg --printsrcinfo > .SRCINFO && makepkg --nodeps --noconfirm --clean"
              cp ./*.pkg.tar.zst /work/site/x86_64/
              repo-add /work/site/x86_64/pacman-repo.db.tar.gz /work/site/x86_64/*.pkg.tar.zst
              rm -f /work/site/x86_64/pacman-repo.db /work/site/x86_64/pacman-repo.files
              ln -s pacman-repo.db.tar.gz /work/site/x86_64/pacman-repo.db
              ln -s pacman-repo.files.tar.gz /work/site/x86_64/pacman-repo.files
              printf "%s\n" "$RELEASE_TAG" > /work/site/release-tags/tolaria-alpha-bin.txt
            '

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
