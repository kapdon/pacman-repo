name: Check tracked releases

on:
  schedule:
    # Low-frequency fallback; Cloudflare handles the five-minute checks.
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tracked-release-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Check tracked upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          check_release() {
            local package=$1
            local name=$2
            local upstream=$3
            local channel=$4
            local marker_url=$5
            local workflow=$6
            local selector tag marker_file status published_tag in_flight

            case "$channel" in
              prerelease)
                selector='[.[] | select(.prerelease and (.draft | not))][0].tag_name'
                ;;
              stable)
                selector='[.[] | select((.prerelease | not) and (.draft | not))][0].tag_name'
                ;;
              published)
                selector='[.[] | select(.draft | not)][0].tag_name'
                ;;
              *)
                echo "Unsupported release channel for $name: $channel" >&2
                return 1
                ;;
            esac

            tag=$(gh api "repos/$upstream/releases?per_page=100" --jq "$selector")
            if [[ -z "$tag" || "$tag" == "null" || ${#tag} -gt 255 || \
                  "$tag" == *$'\r'* || "$tag" == *$'\n'* ]]; then
              echo "Unexpected upstream release tag for $name" >&2
              return 1
            fi

            marker_file=$(mktemp)
            status=$(curl --silent --show-error \
              --retry 2 \
              --retry-all-errors \
              --header 'Cache-Control: no-cache' \
              --output "$marker_file" \
              --write-out '%{http_code}' \
              "${marker_url}?run=${GITHUB_RUN_ID}")

            case "$status" in
              200)
                published_tag=$(< "$marker_file")
                ;;
              404)
                published_tag=
                ;;
              *)
                echo "$name release marker returned HTTP $status" >&2
                return 1
                ;;
            esac

            if [[ -n "$published_tag" && \
                  ( ${#published_tag} -gt 255 || \
                    "$published_tag" == *$'\r'* || \
                    "$published_tag" == *$'\n'* ) ]]; then
              echo "Unexpected published release tag for $name" >&2
              return 1
            fi

            if [[ "$tag" == "$published_tag" ]]; then
              echo "$name is current at $tag"
              return
            fi

            in_flight=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status != "completed")] | length')
            if (( in_flight > 0 )); then
              echo "$name is waiting for an existing $workflow run"
              return
            fi

            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              -f "package=$package" \
              -f "release_tag=$tag"
            echo "Dispatched $workflow for $name at $tag"
          }

          # Each tracked package is one record with its own release channel and marker.
          check_release \
            "tolaria-alpha-bin" \
            "Tolaria alpha" \
            "refactoringhq/tolaria" \
            "prerelease" \
            "https://kapdon.github.io/pacman-repo/release-tags/tolaria-alpha-bin.txt" \
            "publish.yml"

          check_release \
            "tolaria-bin" \
            "Tolaria stable" \
            "refactoringhq/tolaria" \
            "stable" \
            "https://kapdon.github.io/pacman-repo/release-tags/tolaria-bin.txt" \
            "publish.yml"

          check_release \
            "easycli-bin" \
            "EasyCLI" \
            "router-for-me/EasyCLIProxyAPI" \
            "stable" \
            "https://kapdon.github.io/pacman-repo/release-tags/easycli-bin.txt" \
            "publish.yml"
